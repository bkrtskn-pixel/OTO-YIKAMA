# Geliştirme ortamı servisleri (Docker kullananlar için).
# Uygulamalar (api/web) yerelde `pnpm dev` ile çalışır.
#   docker compose -f infra/docker-compose.yml up -d
name: kuzhan-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kuzhan
      POSTGRES_PASSWORD: kuzhan_dev
      POSTGRES_DB: kuzhan
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kuzhan -d kuzhan']
      interval: 5s
      timeout: 5s
      retries: 10

  # Geliştirmede gönderilen e-postaları yakalar: http://localhost:8025 (Faz 11)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  pgdata:
